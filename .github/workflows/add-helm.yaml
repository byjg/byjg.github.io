name: Add helm package
on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      project:
        type: string
        required: true
      folder:
        type: string
        required: true
    secrets:
      DOC_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  add_helm:
    runs-on: ubuntu-latest

    env:
      REPOSITORY: byjg/${{ inputs.repo }}

    steps:
      - name: Checkout repository (byjg.github.io)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DOC_TOKEN }}
          repository: byjg/byjg.github.io
          path: byjg.github.io

      - name: Checkout Project ${{ env.REPOSITORY }} repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: ${{ env.REPOSITORY }}
          path: ${{ inputs.repo }}

      - name: Install Helm
        run: |
          wget https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o /dev/null -O helm.tar.gz
          tar xvf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin
          helm version

      - name: Build Helm Package and Reindex
        run: |
          cd ${{ inputs.repo }}/${{ inputs.folder }}
          helm package ${{ inputs.project }}
          cd -
          mv ${{ inputs.repo }}/${{ inputs.folder }}/${{ inputs.project }}*.tgz byjg.github.io/helm-charts/helm
          helm repo index byjg.github.io/helm-charts/helm --url https://opensource.byjg.com/helm

      - name: Commit and push
        run: |
          cd byjg.github.io
          git add "helm-charts/*"
          git config user.name "CI/CD"
          git config user.email "info@byjg.com.br"
          git diff-index --quiet HEAD || git commit -m "[skip ci] Add helm package '${{ inputs.project }}'"
          # byjg.github.io takes pushes from every project: another one may land
          # between the checkout and the push. Rebase on top of it and retry.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((RANDOM % 10 + 1))
            git pull --rebase
          done
          echo "Could not push to byjg.github.io after 5 attempts" >&2
          exit 1
