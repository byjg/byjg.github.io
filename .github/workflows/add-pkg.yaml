name: Add DEB/RPM package

on:
  workflow_call:
    inputs:
      org:
        type: string
        required: false
        default: byjg
      repo:
        type: string
        required: true
      tag:
        type: string
        required: true
      keep_versions:
        description: How many versions of each package the repositories keep; older ones are deleted
        type: number
        required: false
        default: 8
    secrets:
      DOC_TOKEN:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  add_pkg:
    runs-on: ubuntu-latest

    env:
      REPOSITORY: ${{ inputs.org }}/${{ inputs.repo }}
      # The APT and RPM repositories live in this Cloudflare R2 bucket, served as
      # https://packages.byjg.com (static/_redirects sends opensource.byjg.com/apt and /rpm there).
      R2_BUCKET: s3://byjg-packages
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 does not accept the checksums newer aws-cli versions send by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Checkout scripts (byjg.github.io)
        uses: actions/checkout@v7
        with:
          repository: byjg/byjg.github.io
          path: byjg.github.io
          sparse-checkout: |
            .github

      - name: Download repositories from R2
        run: aws s3 sync "$R2_BUCKET" packages --no-progress

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev createrepo-c rpm gnupg2

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          # Export public key for users to download
          # (binary for APT signed-by, armored for rpm --import)
          GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{found=1} found && /^fpr/{print $10; exit}')
          gpg --export "$GPG_KEY_ID" > packages/byjg.gpg
          gpg --export --armor "$GPG_KEY_ID" > packages/byjg.asc
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.DOC_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ inputs.tag }}" \
            --repo "${{ env.REPOSITORY }}" \
            --pattern "*.deb" \
            --dir assets || true
          gh release download "${{ inputs.tag }}" \
            --repo "${{ env.REPOSITORY }}" \
            --pattern "*.rpm" \
            --dir assets || true

          echo "Downloaded assets:"
          ls -la assets/

      - name: Add DEB packages and reindex
        run: |
          # Copy .deb files to the apt pool
          if ls assets/*.deb 1>/dev/null 2>&1; then
            cp assets/*.deb packages/apt/
            bash byjg.github.io/.github/scripts/prune-packages.sh packages/apt deb ${{ inputs.keep_versions }}

            # Regenerate APT metadata
            cd packages/apt
            dpkg-scanpackages --multiversion . > Packages
            gzip -k -f Packages

            # Generate Release file
            {
              echo "Origin: ByJG Opensource"
              echo "Label: ByJG"
              echo "Suite: stable"
              echo "Codename: stable"
              echo "Architectures: $(awk '/^Architecture:/ && $2 != "all" {print $2}' Packages | sort -u | xargs)"
              echo "Components: main"
              echo "Date: $(date -Ru)"
              echo "MD5Sum:"
              for f in Packages Packages.gz; do
                echo " $(md5sum "$f" | cut -d' ' -f1) $(wc -c < "$f") $f"
              done
              echo "SHA256:"
              for f in Packages Packages.gz; do
                echo " $(sha256sum "$f" | cut -d' ' -f1) $(wc -c < "$f") $f"
              done
            } > Release

            # GPG sign the Release file
            gpg --batch --yes --armor --detach-sign -o Release.gpg Release
            gpg --batch --yes --armor --clearsign -o InRelease Release

            echo "APT repo updated:"
            ls -la
          else
            echo "No .deb files found, skipping APT"
          fi

      - name: Add RPM packages and reindex
        run: |
          # Copy .rpm files to the rpm pool
          if ls assets/*.rpm 1>/dev/null 2>&1; then
            cp assets/*.rpm packages/rpm/
            bash byjg.github.io/.github/scripts/prune-packages.sh packages/rpm rpm ${{ inputs.keep_versions }}

            # Sign the RPMs (dnf gpgcheck=1 refuses unsigned packages). rpmsign
            # skips files already signed by this key and re-signs the others,
            # so older packages are covered too, even after a key rotation.
            echo "%_gpg_name $GPG_KEY_ID" > ~/.rpmmacros
            rpmsign --addsign packages/rpm/*.rpm

            # Regenerate RPM metadata
            createrepo_c --update packages/rpm

            # GPG sign the RPM repo metadata
            gpg --batch --yes --armor --detach-sign \
              -o packages/rpm/repodata/repomd.xml.asc \
              packages/rpm/repodata/repomd.xml

            echo "RPM repo updated:"
            ls -la packages/rpm/
          else
            echo "No .rpm files found, skipping RPM"
          fi

      - name: Upload repositories to R2
        run: |
          # The index files change in place and must never be served stale from the
          # Cloudflare cache: a cached Packages.gz next to a fresh InRelease makes apt
          # fail with "Hash Sum mismatch". They go last, after the packages they list,
          # and old packages are deleted only once nothing points to them anymore.
          METADATA=(--exclude "apt/Packages*" --exclude "apt/*Release*" --exclude "rpm/repodata/repomd.xml*" --exclude "byjg.*")
          aws s3 sync packages "$R2_BUCKET" --no-progress "${METADATA[@]}"
          aws s3 sync packages "$R2_BUCKET" --no-progress --exclude "*" \
            --include "apt/Packages*" --include "apt/*Release*" --include "rpm/repodata/repomd.xml*" --include "byjg.*" \
            --cache-control "no-cache"
          aws s3 sync packages "$R2_BUCKET" --no-progress --delete "${METADATA[@]}"
