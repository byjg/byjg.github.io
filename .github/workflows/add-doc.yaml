name: Add project to the documentation
on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Environment to deploy'
        type: choice
        options:
          - php
          - js
          - devops
          - ai
          - archived
        required: true
      project:
        required: true
        description: 'Project name (without org). e.g. n8n-gitops'
      owner:
        required: false
        description: 'Repository owner/org (defaults to byjg)'
        default: byjg
  workflow_call:
    inputs:
      folder:
        type: string
        required: true
      project:
        type: string
        required: true
      owner:
        type: string
        required: false
        default: byjg
    secrets:
      DOC_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  add_doc:
    runs-on: ubuntu-latest

    env:
      REPOSITORY: ${{ inputs.owner }}/${{ inputs.project }}

    steps:
      - name: Checkout repository (byjg.github.io)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DOC_TOKEN }}
          repository: byjg/byjg.github.io
          path: byjg.github.io

      - name: Checkout repository (byjg/skills)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DOC_TOKEN }}
          repository: byjg/skills
          path: skills

      - name: Checkout Project ${{ env.REPOSITORY }} repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          repository: ${{ env.REPOSITORY }}
          path: ${{ inputs.project }}
          sparse-checkout: |
            README.md
            composer.json
            docs
            .claude/skills

      - name: Copy Doc files
        run: |
          set -x
          
          PROJECT_WITHOUT_FOLDER=$(echo ${{ inputs.project }} | sed "s~^${{ inputs.folder }}-~~")
          rm -rf byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER/
          rm -rf byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER.md

          find . -print
          
          # A project with a docs/ folder or a changelog gets a folder of pages; otherwise its README is a single page
          if [ -d ${{ inputs.project }}/docs ] || ls ${{ inputs.project }}/CHANGELOG*.md >/dev/null 2>&1; then
            mkdir -p byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER
            if [ -d ${{ inputs.project }}/docs ]; then
              cp -r ${{ inputs.project }}/docs/* byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER
            fi
            bash byjg.github.io/.github/scripts/copy-changelogs.sh ${{ inputs.project }} byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER ${{ env.REPOSITORY }}
            # The project README's own front matter is authoritative. Only generate
            # one when it has none - otherwise Docusaurus parses the first block and
            # renders the second as page content, and any tags: are discarded.
            DEST=byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER/README.md
            if head -1 ${{ inputs.project }}/README.md | grep -q '^---$'; then
              sed "s~(docs/~(~g" ${{ inputs.project }}/README.md > "$DEST"
            else
              printf -- '---\nsidebar_key: %s\n---\n\n' "$PROJECT_WITHOUT_FOLDER" > "$DEST"
              sed "s~(docs/~(~g" ${{ inputs.project }}/README.md >> "$DEST"
            fi
            find byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER/ -name '*.md' -exec sed -i "s~\.md)~)~g" {} \; -print
          else
            cp ${{ inputs.project }}/README.md byjg.github.io/docs/${{ inputs.folder }}/$PROJECT_WITHOUT_FOLDER.md
          fi

      - name: Publish the agent skills
        run: |
          # A project's skills live in its .claude/skills/<name>/SKILL.md, next to the code
          # they describe. Publish them like the docs: to byjg/skills, the plugin catalog the
          # installers read (Claude Code, npx skills, Codex), and as the /skills pages of this
          # site. A project without skills removes the ones it published before.
          python3 byjg.github.io/skills.py publish ${{ inputs.project }} ${{ env.REPOSITORY }} skills
          python3 byjg.github.io/skills.py pages skills byjg.github.io

          cd skills
          git add .
          git config user.name "CI/CD"
          git config user.email "info@byjg.com.br"
          git diff-index --quiet HEAD && exit 0
          git commit -m "Publish the skills of ${{ env.REPOSITORY }}"
          # byjg/skills takes pushes from every project, like byjg.github.io below. Rebase
          # on top of one that landed between the checkout and the push, and retry.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((RANDOM % 10 + 1))
            git pull --rebase
          done
          echo "Could not push to byjg/skills after 5 attempts" >&2
          exit 1

      - name: Record dependencies if "php" folder
        if: ${{ inputs.folder == 'php' }}
        run: |
          # The dependency graph is built from composer.json, not from a hand
          # written block in the README. Each project records its own edges here
          # when it publishes; the next step aggregates whatever is on record.
          #
          # A repository without a composer.json at its root is not a package (a
          # comparison or a showcase, say): it publishes its pages and has no place
          # in the graph.
          PROJECT_WITHOUT_FOLDER=$(echo ${{ inputs.project }} | sed "s~^${{ inputs.folder }}-~~")
          if [ ! -f "${{ inputs.project }}/composer.json" ]; then
            echo "No composer.json in ${{ inputs.project }}: not recorded in the dependency graph."
            exit 0
          fi
          mkdir -p byjg.github.io/data/dependencies
          python3 byjg.github.io/collect-deps.py \
            "${{ inputs.project }}/composer.json" \
            "byjg.github.io/data/dependencies/$PROJECT_WITHOUT_FOLDER.json"

      - name: Add Mermaid if "php" folder
        if: ${{ inputs.folder == 'php' }}
        run: |
          cd byjg.github.io
          rm -f docs/php/README.md
          python3 mermaid.py data/dependencies > docs/php/README.md

#      - name: Create sitemap
#        run: |
#          cd byjg.github.io
#          find . -name '*.md' | sed 's~README.md~~g' | sed 's~\.md~~g' | sed 's~^\./~~g' | sort | xargs -I {} echo "https://opensource.byjg.com/{}" > sitemap.txt

      - name: Commit and push
        run: |
          cd byjg.github.io
          git add .
          git config user.name "CI/CD"
          git config user.email "info@byjg.com.br"
          git diff-index --quiet HEAD || git commit -m "Update documentation '${{ inputs.folder }}' '${{ inputs.project }}'"
          # byjg.github.io takes pushes from every project: another one may land
          # between the checkout and the push. Rebase on top of it and retry.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((RANDOM % 10 + 1))
            git pull --rebase
          done
          echo "Could not push to byjg.github.io after 5 attempts" >&2
          exit 1
